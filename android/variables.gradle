ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    /*
     * Native Google sign-in.
     *
     * @capacitor-firebase/authentication defaults this to false, in which case
     * play-services-auth is compileOnly and never reaches the APK. Turning it on
     * is what makes signInWithGoogle() work on a device — Google refuses OAuth in
     * an embedded WebView, so the browser popup this app uses cannot be the
     * mechanism here.
     *
     * It is also a licensing decision, and worth understanding before shipping:
     * play-services-auth is under Google's proprietary Android SDK terms, while
     * GuiTab is GPL-3.0-or-later. Distributing the two linked together is the
     * situation the GPL governs; the GPLv3 system-library exception is arguable
     * for Play Services on Android, but it is arguable rather than settled.
     * Setting this back to false gives up native Google sign-in — anonymous
     * accounts and local storage keep working — and removes the question.
     */
    rgcfaIncludeGoogle = true
}