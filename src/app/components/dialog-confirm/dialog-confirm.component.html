<mat-dialog-content>{{ message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button
    mat-button
    mat-dialog-close>
    {{ cancelLabel }}
  </button>
  <button
    mat-flat-button
    color="primary"
    cdkFocusInitial
    (click)="onButtonConfirmClicked()">
    {{ confirmLabel }}
  </button>
</mat-dialog-actions>
