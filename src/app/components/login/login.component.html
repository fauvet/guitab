@if (user && !authService.isAnonymous()) {
  <button
    mat-icon-button
    [matTooltip]="'Signed in as ' + user.displayName + ' — click to sign out'"
    (click)="onSignOut()">
    @if (user.photoURL) {
      <img
        class="avatar"
        referrerpolicy="no-referrer"
        [src]="user.photoURL"
        [alt]="user.displayName ?? 'User avatar'" />
    } @else {
      <mat-icon>account_circle</mat-icon>
    }
  </button>
} @else {
  <button
    aria-label="Sign in"
    mat-icon-button
    matTooltip="Sign in with Google to sync your files"
    [disabled]="isSigningIn"
    (click)="onSignIn()">
    @if (isSigningIn) {
      <mat-spinner diameter="20" />
    } @else {
      <mat-icon>login</mat-icon>
    }
  </button>
}
