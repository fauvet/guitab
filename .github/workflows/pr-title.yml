name: PR title

# Pull requests are squash-merged, so the title becomes the commit that
# semantic-release reads on main: a title outside Conventional Commits would
# ship without a version bump and without a CHANGELOG entry. Kept out of
# cicd.yml because it has to re-run when the title is edited, and re-running
# the whole build for that would be waste.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        # Passed through the environment, never interpolated into the script:
        # a title is text anyone opening a pull request controls.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|test|docs|chore|build|ci|style|revert)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::\"$TITLE\" is not a Conventional Commits title, e.g. \"feat(editor): add zoom controls\". It decides the next version."
            exit 1
          fi
