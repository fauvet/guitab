name: CICD

# One workflow covering verification, release and deploy. `deploy` declares
# `needs: [lint, typecheck, test, database-rules, build]`, so it cannot run
# unless every one of them has already succeeded in the same run, and it
# reuses the `build` job's own artifact instead of rebuilding. `release` and
# `deploy` additionally require `github.ref == 'refs/heads/main' &&
# github.event_name == 'push'`, so they only fire after a merge — every other
# job runs on every push and every pull request.
#
# Seven jobs, ordered by how fast they fail:
#   • Lint, formatting, and the instruction-tree integrity check
#   • TypeScript, with zero errors
#   • Unit tests with the coverage thresholds from angular.json
#   • database.rules.json against a local Realtime Database emulator
#   • Release — main only: semantic-release bumps the version, writes
#     CHANGELOG.md, commits, tags and publishes a GitHub release
#   • The production build, including its bundle budgets
#   • Deploy to GitHub Pages — main only, after all of the above
#
# `build` waits for `release` so that on main it builds the release commit:
# the version the app displays is read from package.json at build time, and
# building the merge commit instead would ship the previous number. On a
# branch or a pull request `release` is skipped, and `build` runs once the
# verification jobs are done.
#
# Every job but database-rules and deploy runs `npm run setup:env` first.
# src/environments/environment.ts is git-ignored and nothing compiles without
# it, and a pull request from a fork has no access to repository secrets — so
# those jobs write a placeholder config instead. `build` uses the real one
# when secrets are available (always true on a push to this repo, never true
# on a fork's pull request) and falls back to the placeholder otherwise, which
# is what lets `deploy` reuse its artifact rather than building a second time
# with different inputs. None of the verification jobs touch Firebase itself:
# sign-in only happens in a browser, and the rules job talks to a throwaway
# local emulator, never the real project.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint, format, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm run setup:env

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Instruction-tree integrity
        # Fails on a resurrected second instruction tree, a dead path reference,
        # or a document past its size budget. See scripts/check-docs.mjs.
        run: npm run check:docs

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm run setup:env
      - run: npm run typecheck

  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm run setup:env

      - name: Vitest with coverage thresholds
        # Thresholds live in angular.json and the builder exits non-zero below
        # them. They are a floor against whole files nobody tested, not a target.
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  database-rules:
    name: Database rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Java
        # Required by the Realtime Database emulator, which the Firebase CLI runs on the JVM.
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - run: npm ci

      - name: database.rules.json against the emulator
        # demo-guitab needs no real project or credentials — the "demo-" prefix
        # tells the emulator to run standalone. See database.rules.spec.ts.
        run: npm run test:rules:emulator

  release:
    name: Release
    needs: [lint, typecheck, test, database-rules]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Two merges in quick succession must not compute the same next version.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release-commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          # semantic-release reads every commit since the last tag.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
        env:
          # The release commit only touches generated files; the pre-commit
          # hook has nothing to check there and would only slow it down.
          HUSKY: 0

      - name: semantic-release
        # Commits that warrant no release (docs, test, chore…) end here with
        # nothing published, and the current version is deployed again. The
        # release commit carries [skip ci], and a push made with GITHUB_TOKEN
        # never starts a workflow anyway — this run is the one that deploys it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: npx semantic-release

      - name: Hand the commit to build
        id: release-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Production build
    needs: [release]
    # `release` is skipped everywhere but main, and a skipped need would
    # otherwise skip this job too.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        # `npm ci` rather than `npm install`: on main this is the build that
        # gets deployed, so it must use the dependency tree the lockfile pins
        # and not resolve a fresher one that nothing tested.
        run: npm ci

      - name: Create environment.ts from secrets, or a placeholder
        # A pull request from a fork sees empty secrets. Building against a
        # placeholder still exercises everything that can fail at build time —
        # templates, types, bundle budgets — so the job stays useful either way.
        # A push to this repo (including main) always has secrets, so this is
        # also what puts the real config into the artifact `deploy` publishes.
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -n "$FIREBASE_API_KEY" ]; then
            cat > src/environments/environment.ts << 'EOF'
          import { Environment } from "./environment.template";

          export const environment: Environment = {
            firebase: {
              apiKey: "${{ secrets.FIREBASE_API_KEY }}",
              authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
              databaseURL: "${{ secrets.FIREBASE_DATABASE_URL }}",
              projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
              storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
              messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
              appId: "${{ secrets.FIREBASE_APP_ID }}",
            },
          };
          EOF
          else
            npm run setup:env
          fi

      - run: npm run build

      - name: Prepare the GitHub Pages output
        # Only needed on the path deploy actually publishes — a PR or a branch
        # build has no reason to reshape docs/ for Pages.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mv docs/browser/* docs
          rm -r docs/browser
          cp docs/index.html docs/404.html

      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: pages-build
          path: docs/
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: [lint, typecheck, test, database-rules, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the Pages artifact built above
        uses: actions/download-artifact@v4
        with:
          name: pages-build
          path: docs

      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v1
        with:
          target_branch: gh-pages
          build_dir: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
