name: CICD

# The deploy half. ci.yml verifies every branch and every pull request; this one
# runs only on `main`, after a merge, and publishes to GitHub Pages plus the
# Firestore rules. Keep the runner and action versions in step with ci.yml —
# they drifted apart once, to actions and a Node version that did not exist, and
# nothing noticed because this workflow only ever runs after the fact.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        # `npm ci` rather than `npm install`: this job publishes what users get,
        # so it must build the dependency tree the lockfile pins and not resolve
        # a fresher one that nothing tested.
        run: npm ci

      - name: Create environment.ts from secrets
        run: |
          cat > src/environments/environment.ts << 'EOF'
          import { Environment } from "./environment.template";

          export const environment: Environment = {
            firebase: {
              apiKey: "${{ secrets.FIREBASE_API_KEY }}",
              authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
              projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
              storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
              messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
              appId: "${{ secrets.FIREBASE_APP_ID }}",
            },
          };
          EOF

      - name: Build
        run: |
          npm run build
          mv docs/browser/* docs
          rm -r docs/browser
          cp docs/index.html docs/404.html

      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v1
        with:
          target_branch: gh-pages
          build_dir: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Firestore rules
        run: npx firebase-tools deploy --only firestore:rules --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
